<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Velora</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; background: #191b1e; color: #f1eee7; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; }
		main { width: min(320px, calc(100vw - 48px)); text-align: center; }
		h1 { font-size: 28px; font-weight: 500; letter-spacing: -.8px; margin: 0 0 28px; }
		p { color: #c4c3bf; font-size: 14px; line-height: 1.6; }
		progress { width: 100%; height: 4px; accent-color: #cbbb9b; border: 0; }
		button { margin: 16px 4px 0; background: #ffffff0d; color: inherit; border: 1px solid #ffffff24; border-radius: 7px; padding: 10px 16px; cursor: pointer; }
		button:focus-visible { outline: 2px solid #cbbb9b; outline-offset: 3px; }
		[hidden] { display: none; }
	</style>
</head>
<body>
	<main>
		<h1>Velora</h1>
		<p id="status" role="status" aria-live="polite">Preparing your space…</p>
		<progress id="progress" aria-label="Preparing Velora"></progress>
		<p id="detail">The first visit downloads the app. Future visits reuse your saved copy.</p>
		<button id="retry" hidden>Try again</button>
		<noscript><p>Enable JavaScript to open Velora.</p></noscript>
	</main>
	<script type="module" src="/velora-bootstrap.js"></script>
</body>
</html>
