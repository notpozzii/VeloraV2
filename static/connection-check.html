<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Velora connection check</title>
<style>body{margin:0;padding:32px;background:#172019;color:#e5eadf;font:16px system-ui;line-height:1.6}main{max-width:780px;margin:auto}h1{font-size:24px}button{font:inherit;color:inherit;background:#28382c;border:1px solid #75856c;border-radius:8px;padding:10px 18px;cursor:pointer}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:20px;border:1px solid #46543f;border-radius:12px;background:#101610}</style>
<main><h1>Velora connection check</h1><p>This checks this site's browser connection. It does not read sign-ins or clear saved data.</p><button id="run">Check again</button><pre id="result" role="status">Starting…</pre></main>
<script>
const output = document.querySelector('#result');
const button = document.querySelector('#run');
const info = worker => worker ? { script: new URL(worker.scriptURL).pathname, state: worker.state } : null;
async function check() {
 button.disabled = true;
 const report = { secure: isSecureContext, serviceWorkers: !!navigator.serviceWorker };
 const show = () => { output.textContent = JSON.stringify(report, null, 2); };
 const bounded = (promise, label) => Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error(label + ' timed out')), 5000))]);
 try {
  if (!navigator.serviceWorker) throw Error('Service workers unavailable');
  report.controller = info(navigator.serviceWorker.controller); show();
  const registrations = await bounded(navigator.serviceWorker.getRegistrations(), 'Reading registrations');
  report.registrations = registrations.map(r => ({scope: new URL(r.scope).pathname, active: info(r.active), installing: info(r.installing), waiting: info(r.waiting), controllerIsActive: r.active === navigator.serviceWorker.controller})); show();
  try { const response = await bounded(fetch('/__velora_proxy_ready?request=connection-check', { cache: 'no-store' }), 'Routing check'); report.routing = { status: response.status, handledByVelora: response.headers.get('X-Velora-Proxy-Ready') === '1', nonceMatches: await response.text() === 'connection-check' }; } catch(error) { report.routing = { error: error.message }; } show();
  try { const registration = await bounded(navigator.serviceWorker.register('/servy.js', {type:'classic', updateViaCache:'none'}), 'Worker registration'); report.registration = { active: info(registration.active), installing: info(registration.installing), waiting: info(registration.waiting), controllerIsActive: registration.active === navigator.serviceWorker.controller }; } catch(error) { report.registration = { error: error.name + ': ' + error.message }; } show();
 } catch(error) { report.error = error.message; show(); }
 finally { button.disabled = false; }
}
button.onclick = check;
check();
</script></html>
