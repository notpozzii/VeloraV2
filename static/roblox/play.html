<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Joining experience</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#191b21;color:#f2f3f5;font:14px Arial,Helvetica,system-ui,sans-serif}*{box-sizing:border-box}[hidden]{display:none!important}#canvas{width:100%;height:100%;display:block}#loading-overlay{position:absolute;inset:0;overflow:hidden;background:#1b1d23;z-index:2;isolation:isolate;opacity:1;transition:opacity .6s ease}#loading-overlay[hidden],#loading-overlay.dismissed,#loading-overlay.hidden{display:none}#loading-overlay.loading-exiting{opacity:0;pointer-events:none}.loading-backdrop{position:absolute;inset:-5%;z-index:-2;overflow:hidden}.background-mark{position:absolute;width:56vw;height:56vw;max-width:1000px;max-height:1000px;right:11%;top:16%;fill:#474a54;opacity:.42;filter:blur(16px);transform:rotate(16deg)}#loading-background-image{width:100%;height:100%;object-fit:cover;filter:blur(25px);opacity:0;transform:scale(1.12);transition:opacity .35s}.loading-backdrop.loading-image-ready #loading-background-image{opacity:.3}#loading-overlay::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,#13151a15 15%,#11121680 65%,#08090be6 100%)}.loading-card{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(58vw,1200px);min-height:clamp(240px,34vh,380px);padding:100px 28px 36px;border-radius:10px;background:#24262cc9;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:clamp(28px,3vw,50px);text-align:center}#loading-icon-shell{position:absolute;top:0;left:50%;transform:translate(-50%,-50%);width:clamp(140px,14.6vw,300px);aspect-ratio:1;border-radius:12px;overflow:hidden;background:linear-gradient(120deg,#67686b 0%,#24262e 55%,#20222b 100%)}.icon-mark{position:absolute;width:43%;height:43%;left:28.5%;top:28.5%;fill:#5f626e;transform:rotate(15deg)}#loading-experience-icon{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .25s}#loading-icon-shell.loading-image-ready #loading-experience-icon{opacity:1}#loading-experience-title{font-size:clamp(24px,2vw,40px);font-weight:700;line-height:1.2;margin:0;max-width:100%;overflow-wrap:anywhere}.creator-line{display:flex;align-items:center;justify-content:center;gap:7px;min-height:1.4em;color:#c5c6cc;font-size:clamp(16px,1.1vw,22px);line-height:1.4}#loading-verified-badge{width:17px;height:17px;color:#4a9aff}#status{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);max-width:calc(100% - 56px);margin:0;color:#bec0c6;font-size:12px;line-height:1.5;text-align:center;white-space:pre-line}button{font:inherit;cursor:pointer}#loading-cancel{position:absolute;top:24px;left:24px;z-index:3;width:38px;height:38px;padding:0;border:0;border-radius:6px;background:transparent;color:#fff}#loading-cancel svg{width:100%;height:100%;display:block}#loading-cancel:hover{background:#ffffff13}button:focus-visible{outline:2px solid white;outline-offset:5px}.loading-error-panel{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(460px,calc(100% - 48px));padding:32px;border:1px solid #ffffff16;border-radius:12px;background:#25272f;text-align:center;box-shadow:0 18px 80px #0005}.loading-error-panel h2{font-size:25px;margin:0 0 18px}.loading-error-panel p{line-height:1.55;color:#c5c6cc;overflow-wrap:anywhere}.loading-error-panel button{margin-top:12px;padding:10px 32px;border:1px solid #ffffff30;border-radius:7px;color:#fff;background:#ffffff12}.loading-error-panel button:hover{background:#ffffff20}.loading-failed .loading-error-panel:not([hidden]){display:block}.loading-failed .loading-card,.loading-failed #status{display:none}#input-container{position:absolute;bottom:0;left:0;z-index:4;display:none}.debug{display:none}@media(max-width:700px){.loading-card{width:84vw;min-height:250px;padding:90px 20px 30px;gap:28px}#loading-icon-shell{width:150px}#loading-experience-title{font-size:26px}#loading-cancel{top:18px;left:18px;width:30px;height:30px}.background-mark{width:85vw;height:85vw;right:-5%;top:22%}}@media(max-height:500px){.loading-card{min-height:160px;padding:55px 20px 20px;gap:15px;width:65vw}#loading-icon-shell{width:100px}#loading-experience-title{font-size:23px}#loading-experience-creator{font-size:15px}#status{bottom:8px}}@media(prefers-reduced-motion:reduce){#loading-overlay,#loading-experience-icon,#loading-background-image{transition:none}}
</style>
<style>
.loading-error-panel{max-height:calc(100% - 80px);overflow:auto}#connection-report-tools{margin-top:16px;padding-top:16px;border-top:1px solid #ffffff16}#connection-report-copy{margin:0;padding:10px 18px}#connection-report-status{font-size:12px;line-height:1.5;margin:10px 0 0;color:#b9c2cf}#connection-report-text{display:block;width:100%;height:130px;margin-top:12px;padding:10px;resize:vertical;border:1px solid #ffffff30;border-radius:6px;background:#191b21;color:#edf0f7;font:11px/1.5 monospace;text-align:left}
</style>
</head>
<body>
<canvas id="canvas" tabindex="0" oncontextmenu="return false"></canvas>
<section id="loading-overlay" aria-label="Joining experience" aria-busy="true">
  <div class="loading-backdrop"><svg class="background-mark" viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M0 0h100v100H0zM38 38v24h24V38z"/></svg><img id="loading-background-image" alt=""></div>
  <button id="loading-cancel" aria-label="Cancel joining and return to Roblox"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="m4 4 32 32M36 4 4 36" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg></button>
  <div class="loading-card">
    <div id="loading-icon-shell"><svg class="icon-mark" viewBox="0 0 100 100" aria-hidden="true"><path fill-rule="evenodd" d="M0 0h100v100H0zM38 38v24h24V38z"/></svg><img id="loading-experience-icon" alt=""></div>
    <h1 id="loading-experience-title">Joining experience</h1>
    <div class="creator-line"><span id="loading-experience-creator"></span><span id="loading-verified-badge" role="img" aria-label="Verified creator" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><path fill="currentColor" d="m10 0 3 2 3.5.5L18 6l2 4-2 4-1.5 3.5L13 18l-3 2-3-2-3.5-.5L2 14l-2-4 2-4L3.5 2.5 7 2z"/><path d="m5.5 10 3 3 6-6" fill="none" stroke="white" stroke-width="2"/></svg></span></div>
  </div>
  <p id="status" role="status" aria-live="polite">Preparing experience…</p>
  <div class="loading-error-panel" role="alert" hidden><h2 id="loading-error-title"></h2><p id="loading-error-message"></p><p id="loading-error-code"></p><button id="loading-error-leave">Back to Roblox</button><div id="connection-report-tools" hidden><button id="connection-report-copy" type="button">Copy connection report</button><p id="connection-report-status" role="status"></p><textarea id="connection-report-text" aria-label="Connection report" readonly hidden></textarea></div></div>
</section>
<div id="input-container"><textarea id="input-textarea" aria-label="Game text"></textarea><input id="input-input" aria-label="Game input"></div>
<div class="debug"><span id="server"></span><span id="proxyenabled"></span></div>
<script src="/roblox/bridge.js"></script><script src="/roblox/player.js"></script>
</body></html>
