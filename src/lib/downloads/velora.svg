<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%"
     role="application" aria-label="Velora desktop"
     style="display:block;width:100vw;height:100vh;overflow:hidden;background:#17221c">
  <title>Velora</title>
  <desc>The desktop runs directly inside this SVG. Images and online apps require internet. Open directly in a browser.</desc>
  <foreignObject x="0" y="0" width="100%" height="100%">
    <html xmlns="http://www.w3.org/1999/xhtml" style="width:100%;height:100%;margin:0;overflow:hidden">
      <head id="velora-svg-head">
        <meta name="viewport" content="width=device-width, initial-scale=1"/>
        <!-- PORTABLE_STYLE -->
      </head>
      <body id="velora-svg-body" style="width:100%;height:100%;margin:0;overflow:hidden">
        <div id="portable-startup" role="status">Opening Velora…</div>
        <div id="velora-root"></div>
        <noscript>This desktop requires JavaScript. Open this SVG directly in a browser.</noscript>
      </body>
    </html>
  </foreignObject>
  <!-- PORTABLE_SCRIPT -->
</svg>
